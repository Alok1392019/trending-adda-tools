<section class="section-padding" style="padding-top: 120px; margin-bottom: 5rem;">
  <div class="container">
    <!-- Breadcrumbs -->
    <ul class="breadcrumbs">
      <li><a href="/">Home</a></li>
      <li style="color: var(--primary); font-weight: 600;">{{categoryName}}</li>
    </ul>
    
    <!-- Title Area -->
    <div style="margin-bottom: 3.5rem; text-align: center;">
      <span class="hero-tag">Category Overview</span>
      <h1 class="glow-text" style="font-size: 3rem; margin-top: 0.5rem; margin-bottom: 1rem;">{{categoryName}}</h1>
      <p style="color: var(--text-muted); max-width: 700px; margin: 0 auto; font-size: 1.05rem;">{{categoryDesc}}</p>
    </div>
    
    <!-- AdSense Top Banner -->
    <div class="adsense-placeholder">
      <div>📣 ADVERTISEMENT</div>
      <div style="font-size: 0.75rem; margin-top: 0.25rem;">Google AdSense Banner (Auto Responsive)</div>
    </div>
    
    <!-- Tools Grid -->
    <div class="grid grid-3" style="margin-top: 3rem; margin-bottom: 4rem;">
      {{{toolsCardsHtml}}}
    </div>
    
    <!-- Category SEO Copy Section -->
    <div class="glass-panel" style="padding: 3rem; line-height: 1.8;">
      <div class="seo-content" style="color: var(--text-muted);">
        {{{categorySeoContent}}}
      </div>
    </div>
  </div>
</section>
